<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operations Directory — Artium Academy Reviews</title>
  <link rel="stylesheet" href="css/styles.css?v=7" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main-area">
      <div id="topbarSlot"></div>

      <main class="page">

      <div class="page-header-row">
        <div>
          <h1>Operations Directory</h1>
          <div class="sub">People responsible for review targets, their assigned centre, role, and email cadence</div>
        </div>
        <div class="header-actions">
          <div class="role-switcher">
            Viewing as
            <select class="select-control" id="roleSwitcher" aria-label="Viewing as role">
              <option value="Admin">Admin</option>
              <option value="Operations Owner">Operations Owner</option>
              <option value="Teacher">Teacher</option>
            </select>
          </div>
          <button class="btn btn-primary" id="addPersonBtn" type="button">+ Add person</button>
        </div>
      </div>

      <div class="readonly-note" id="readonlyNote" style="display:none;">
        You're viewing in read-only mode. Only Admins can add, edit, or remove people, or change target ownership.
      </div>

      <div class="card table-card">
        <table class="data-table">
          <thead>
            <tr>
              <th>Person</th>
              <th>Assigned centre</th>
              <th>Role</th>
              <th>Cadence</th>
              <th>Target ownership</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="directoryTableBody"></tbody>
        </table>
      </div>

      </main>
    </div>
  </div>

  <!-- Add / Edit Person modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3 id="modalTitle">Add person</h3>
      <form id="personForm">
        <div class="form-field">
          <label for="fieldName">Name</label>
          <input type="text" id="fieldName" required />
        </div>
        <div class="form-field">
          <label for="fieldEmail">Email</label>
          <input type="email" id="fieldEmail" required />
        </div>
        <div class="form-field">
          <label for="fieldCentre">Assigned centre</label>
          <select id="fieldCentre"></select>
        </div>
        <div class="form-field">
          <label for="fieldRole">Role</label>
          <select id="fieldRole">
            <option value="Admin">Admin</option>
            <option value="Operations Owner">Operations Owner</option>
            <option value="Teacher">Teacher</option>
          </select>
        </div>
        <div class="form-field">
          <label for="fieldCadence">Email cadence</label>
          <select id="fieldCadence">
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Fortnightly">Fortnightly</option>
            <option value="Monthly">Monthly</option>
          </select>
        </div>
        <div class="form-field">
          <label class="checkbox-field">
            <input type="checkbox" id="fieldOwnsTarget" />
            Owns the review target for this centre
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="modalCancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/operations.js"></script>
</body>
</html>
