<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artium Academy — Reviews Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">

  <main class="login-card card">
    <div class="login-brand">Artium Academy</div>
    <p class="login-tagline">
      A Google My Business reviews monitoring system to improve organic footprint structurally
    </p>

    <button class="google-btn" id="googleSignInBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.61z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.9-2.26c-.81.54-1.85.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.69V4.98H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.02l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.98l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      <span>Sign in with Google</span>
    </button>

    <div class="login-error" id="loginError">
      Your Google account isn't authorized for this dashboard. Contact your admin to be added.
    </div>

    <p class="login-footnote">Internal use only &middot; Artium Academy</p>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Login screen behaviour.
    // NOTE: this is a placeholder flow. Real Google OAuth (with domain /
    // allow-list restriction) gets wired in once we're ready for the
    // security step — for now, signing in takes you straight to the
    // dashboard so we can build and review the rest of the views.
    document.getElementById('googleSignInBtn').addEventListener('click', function () {
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
